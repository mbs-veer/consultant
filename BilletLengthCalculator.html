<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billet length calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECEF;--surface:#FFFFFF;--ink:#14212A;--muted:#55656F;--line:#C9D2D8;
  --accent:#0B5C8A;--accent-ink:#FFFFFF;--accent-soft:#A9CBE0;--field:#F3F5F7;
  --warn:#7A4800;--warn-bg:#FFF0D2;--bar:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F171C;--surface:#18232A;--ink:#E6EDF1;--muted:#93A4AF;--line:#2B3A43;
    --accent:#5FB0E0;--accent-ink:#0B1A22;--accent-soft:#2D6384;--field:#111B21;
    --warn:#F2BE6B;--warn-bg:#3A2D12;--bar:#18232A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171C;--surface:#18232A;--ink:#E6EDF1;--muted:#93A4AF;--line:#2B3A43;
  --accent:#5FB0E0;--accent-ink:#0B1A22;--accent-soft:#2D6384;--field:#111B21;
  --warn:#F2BE6B;--warn-bg:#3A2D12;--bar:#18232A;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bar);border-bottom:1px solid var(--line);padding:10px 16px}
.bar h1{margin:0 0 6px;font:600 15px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;color:var(--muted)}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;align-items:end}
.stat b{display:block;font:700 28px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat.main b{font-size:40px;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:16px}
section,details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{margin:0 0 12px;font:600 19px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.fld{position:relative}
.fld input,.fld select{width:100%;height:46px;padding:0 44px 0 12px;font:500 17px Barlow,system-ui,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;appearance:none;-webkit-appearance:none}
.fld select{padding-right:44px}
.fld .u{position:absolute;right:12px;bottom:12px;font-size:14px;color:var(--muted);pointer-events:none}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
dl{margin:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row dt{color:var(--muted)}
.row dd{margin:0;text-align:right;font:600 18px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.row dd small{font:400 14px Barlow,system-ui,sans-serif;color:var(--muted);margin-left:4px}
.strip{display:flex;gap:2px;height:30px;margin:4px 0 10px}
.seg{flex:var(--w) 1 0;min-width:3px;border-radius:3px}
.s1{background:var(--accent)}
.s2{background:var(--accent-soft)}
.s3{border:2px solid var(--accent)}
.note{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:15px}
.note:empty{display:none}
summary{cursor:pointer;font:600 19px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;min-height:30px}
.tbl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 40px;gap:6px;margin-top:12px;align-items:center}
.tbl .h{font-size:13px;color:var(--muted)}
.tbl input{width:100%;height:42px;padding:0 8px;font:500 16px Barlow,system-ui,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px}
button{font:500 16px Barlow,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.x{padding:0;width:40px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.hint{margin:10px 0 0;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header class="bar">
  <h1>Billet length calculator</h1>
  <div class="stats">
    <div class="stat main"><b id="hy">—</b><span>Prime yield %</span></div>
    <div class="stat"><b id="hb">—</b><span>Bars on CB</span></div>
    <div class="stat"><b id="hc">—</b><span>Customer bars</span></div>
  </div>
</header>
<main>
  <section><h2>Billet and furnace</h2><div class="grid" id="g1"></div></section>
  <section><h2>Finished bar</h2><div class="grid" id="g2"></div></section>
  <section><h2>Divide shear</h2><div class="grid" id="g3"></div></section>
  <section>
    <h2>Results</h2>
    <p class="note" id="note"></p>
    <dl id="res"></dl>
  </section>
  <section>
    <h2>Cut plan on cooling bed</h2>
    <div class="strip" id="strip" role="img" aria-label="Bars cut from one billet"></div>
    <dl id="plan"></dl>
  </section>
  <details>
    <summary>Bundle table</summary>
    <div class="tbl" id="tbl"></div>
    <div class="acts"><button id="add">Add size</button></div>
    <p class="hint">Weight per bar is bundle weight divided by bars per bundle. Bar size in the calculator comes from this table.</p>
  </details>
  <div class="acts"><button id="reset">Reset to workbook values</button></div>
</main>
<script>
const KEY='billet-calc-v1';
const DEF={size:'32',w:'2100',scale:'1.5',s1:'7.5',s2:'0',neg:'3.5',cust:'12.03',fc:'60',rc:'84',fe:'500',re:'300'};
const DROWS=[['20','2.47','68','2.016'],['25','3.85','44','2.033'],['32','6.31','26','1.969'],['40','9.858','17','2.011']];
let S={...DEF},R=DROWS.map(r=>r.slice());
try{
  const j=JSON.parse(localStorage.getItem(KEY)||'null');
  if(j&&j.S&&Array.isArray(j.R)&&j.R.every(r=>Array.isArray(r)&&r.length===4)){S={...DEF,...j.S};R=j.R;}
}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({S,R}))}catch(e){}};
const $=id=>document.getElementById(id);
const num=v=>parseFloat(v);
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fl=x=>Math.floor(x+1e-9);
const fmt=(x,d)=>isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';

const groups={
  g1:[['w','Billet weight','kg'],['scale','Scale loss in furnace','%'],['s1','Shear 1 cut','kg'],['s2','Shear 2 cut','kg']],
  g2:[['size','Size','mm'],['neg','Negative rolling','%'],['cust','Customer length','m']],
  g3:[['fc','First cut length','m'],['rc','Regular cut length','m'],['fe','First bar end cut','mm'],['re','Regular bar end cut','mm']]
};
for(const g in groups){
  $(g).innerHTML=groups[g].map(([k,l,u])=>
    '<div class="fld"><label for="f_'+k+'">'+l+'</label>'+
    (k==='size'?'<select id="f_size"></select>':'<input id="f_'+k+'" data-k="'+k+'" type="number" inputmode="decimal" step="any" value="'+S[k]+'">')+
    '<span class="u">'+u+'</span></div>').join('');
}

function sizes(){
  const s=[...new Set(R.map(r=>num(r[0])).filter(isFinite))].sort((a,b)=>a-b);
  return s;
}
function fillSizes(){
  const sel=$('f_size'),s=sizes();
  if(!s.length){sel.innerHTML='<option value="">None</option>';sel.disabled=true;return;}
  sel.disabled=false;
  if(!s.includes(num(S.size))){S.size=String(s[0]);}
  sel.innerHTML=s.map(x=>'<option value="'+x+'"'+(x===num(S.size)?' selected':'')+'>'+x+'</option>').join('');
}

function calc(){
  const v={};for(const k in DEF)v[k]=num(S[k]);
  const o={ok:false,msg:''};
  o.f2=v.w*(100-v.scale)/100;
  o.f3=o.f2-v.s1-v.s2;
  const uw=((100-v.neg)/100)*v.size*v.size/162;
  o.f4=r2(o.f3/uw);
  const row=R.find(r=>num(r[0])===v.size);
  const first=v.fc+v.fe/1000,step=v.rc+v.re/1000;
  const rem=o.f4-first;
  const all=Object.values(v).every(isFinite);
  if(!all){o.msg='Enter every input to see results.';return o;}
  if(!(uw>0)||!(o.f3>0)){o.msg='Check billet weight, cuts and negative rolling: finished bar weight is not positive.';return o;}
  if(!(step>0)||!(v.cust>0)){o.msg='Regular cut length and customer length must be above zero.';return o;}
  if(rem<0){o.msg='Finished bar length ('+fmt(o.f4,2)+' m) is shorter than the first cut length plus end cut.';return o;}
  const q=fl(rem/step);
  o.q=q;o.first=first;o.step=step;
  o.f5=2+q;
  o.f6=Math.max(0,rem-step*q);
  o.f7=fl(first/v.cust)+q*fl(step/v.cust)+fl(o.f6/v.cust);
  o.ok=true;
  if(row){
    const per=num(row[3])/num(row[2]);
    o.f8=per*o.f7;
    o.y=r2(o.f8*1000/v.w*100);
    if(!isFinite(o.f8)){o.f8=NaN;o.y=NaN;o.msg='Bundle table row for size '+v.size+' mm is incomplete.';}
  }else{
    o.f8=NaN;o.y=NaN;o.msg='Size '+v.size+' mm is not in the bundle table, so bundle weight and yield cannot be worked out.';
  }
  return o;
}

function render(){
  const o=calc();
  $('note').textContent=o.msg;
  const ok=o.ok;
  $('hy').textContent=ok?fmt(o.y,2):'—';
  $('hb').textContent=ok?fmt(o.f5,0):'—';
  $('hc').textContent=ok?fmt(o.f7,0):'—';
  const line=(l,x,d,u)=>'<div class="row"><dt>'+l+'</dt><dd>'+fmt(x,d)+'<small>'+u+'</small></dd></div>';
  $('res').innerHTML=
    line('Billet weight after discharging from furnace',o.f2,2,'kg')+
    line('Weight of the finished bar from the mill',o.f3,2,'kg')+
    line('Length of the finished bar',o.f4,2,'m')+
    line('Number of bars on CB per billet',ok?o.f5:NaN,0,'pc')+
    line('Length of the last bar',ok?o.f6:NaN,2,'m')+
    line('No. of customer length bars per billet',ok?o.f7:NaN,0,'pc')+
    line('Theoretical weight of the bundles',ok?o.f8:NaN,3,'MT')+
    line('Prime yield',ok?o.y:NaN,2,'%');
  if(ok){
    let h='<div class="seg s1" style="--w:'+o.first+'"></div>';
    for(let i=0;i<o.q;i++)h+='<div class="seg s2" style="--w:'+o.step+'"></div>';
    h+='<div class="seg s3" style="--w:'+Math.max(o.f6,0.01)+'"></div>';
    $('strip').innerHTML=h;
    $('plan').innerHTML=
      line('First bar (cut length plus end cut)',o.first,2,'m')+
      '<div class="row"><dt>Regular bars (cut length plus end cut)</dt><dd>'+o.q+' &times; '+fmt(o.step,2)+'<small>m</small></dd></div>'+
      line('Last bar',o.f6,2,'m');
  }else{$('strip').innerHTML='';$('plan').innerHTML='';}
}

function drawTable(){
  let h='<div class="h">Size mm</div><div class="h">kg/m</div><div class="h">Bars/bundle</div><div class="h">Bundle MT</div><div></div>';
  R.forEach((r,i)=>{
    for(let c=0;c<4;c++)h+='<input type="number" inputmode="decimal" step="any" aria-label="Row '+(i+1)+' column '+(c+1)+'" data-r="'+i+'" data-c="'+c+'" value="'+r[c]+'">';
    h+='<button class="x" data-del="'+i+'" aria-label="Delete row '+(i+1)+'">&times;</button>';
  });
  $('tbl').innerHTML=h;
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){S[t.dataset.k]=t.value;}
  else if(t.id==='f_size'){S.size=t.value;}
  else if(t.dataset.r){R[+t.dataset.r][+t.dataset.c]=t.value;fillSizes();}
  else return;
  save();render();
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.del!==undefined){R.splice(+t.dataset.del,1);drawTable();fillSizes();}
  else if(t.id==='add'){R.push(['','','','']);drawTable();}
  else if(t.id==='reset'){S={...DEF};R=DROWS.map(r=>r.slice());for(const k in DEF)if(k!=='size')$('f_'+k).value=S[k];drawTable();fillSizes();}
  else return;
  save();render();
});

fillSizes();drawTable();render();
</script>
</body>
</html>
