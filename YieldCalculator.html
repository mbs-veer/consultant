<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yield calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECEF;--surface:#FFFFFF;--ink:#14212A;--muted:#55656F;--line:#C9D2D8;
  --accent:#0B5C8A;--accent-ink:#FFFFFF;--field:#F3F5F7;--bar:#FFFFFF;
  --warn:#7A4800;--warn-bg:#FFF0D2;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F171C;--surface:#18232A;--ink:#E6EDF1;--muted:#93A4AF;--line:#2B3A43;
    --accent:#5FB0E0;--accent-ink:#0B1A22;--field:#111B21;--bar:#18232A;
    --warn:#F2BE6B;--warn-bg:#3A2D12;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171C;--surface:#18232A;--ink:#E6EDF1;--muted:#93A4AF;--line:#2B3A43;
  --accent:#5FB0E0;--accent-ink:#0B1A22;--field:#111B21;--bar:#18232A;
  --warn:#F2BE6B;--warn-bg:#3A2D12;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bar);border-bottom:1px solid var(--line);padding:10px 16px}
.bar h1{margin:0 0 6px;font:600 15px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;color:var(--muted)}
.stats{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:end}
.stat b{display:block;font:700 26px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat.main b{font-size:36px;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.kc{border-radius:10px;padding:10px 12px;display:grid;gap:12px;align-items:end}
.kc.or{background:#FF8A2B;grid-template-columns:1.2fr 1fr}
.kc.or .stat b{color:#111}
.kc.or .stat span{color:#3A1B00}
.kc.gr{background:var(--field);border:1px solid var(--line)}
.kc.gr .stat b{color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:16px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{margin:0 0 12px;font:600 19px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;font-size:14px;color:var(--muted)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.fld{position:relative}
.fld input{width:100%;height:46px;padding:0 44px 0 12px;font:500 17px Barlow,system-ui,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px}
.fld .u{position:absolute;right:12px;bottom:12px;font-size:14px;color:var(--muted);pointer-events:none}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.rl{font:600 16px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:6px 0 2px}
.rl:first-child{margin-top:0}
dl{margin:0}
.row{display:grid;grid-template-columns:1fr 86px 86px;gap:8px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.gap{margin-top:8px;border-top:2px solid var(--line)}
.row dt{color:var(--muted)}
.row dd{margin:0;text-align:right;font:600 18px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.row dd small{font:400 14px Barlow,system-ui,sans-serif;color:var(--muted);margin-left:4px}
.row.hd dd{font:500 14px Barlow,system-ui,sans-serif;color:var(--muted)}
.note{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:15px}
.note:empty{display:none}
.alt{--s:#E1F3EA;--l:#86C3A9;--a:#17694A;background:var(--s);border-color:var(--l)}
.alt h2,.alt .row dd{color:var(--a)}
.alt .row{border-top-color:var(--l)}
.alt .row dt{color:var(--ink)}
.row.two{grid-template-columns:1fr auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alt{--s:#12291F;--l:#2E6B52;--a:#6EDBAA}}
:root[data-theme="dark"] .alt{--s:#12291F;--l:#2E6B52;--a:#6EDBAA}
button{font:500 16px Barlow,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<header class="bar">
  <h1>Yield calculator</h1>
  <div class="stats">
    <div class="kc or"><div class="stat main"><b id="hy">—</b><span>Yield %</span></div>
    <div class="stat"><b id="hn">—</b><span>Negative rolling %</span></div></div>
    <div class="kc gr"><div class="stat"><b id="hs">—</b><span>Scale %</span></div></div>
  </div>
</header>
<main>
  <section>
    <h2>Billet rolled</h2>
    <div class="fld"><label for="f_bill">Billet rolled</label><input id="f_bill" data-k="bill" type="number" inputmode="decimal" step="any"><span class="u">MT</span></div>
  </section>
  <section>
    <h2>Weights</h2>
    <div class="cols"><span>Entry A</span><span>Entry B</span></div>
    <div class="grid" id="g"></div>
  </section>
  <section>
    <h2>Results</h2>
    <p class="note" id="note"></p>
    <dl id="res"></dl>
  </section>
  <div><button id="reset">Clear all</button></div>
</main>
<script>
const KEY='yield-calc-v1';
const ROWS=[['act','Act weight'],['prime','Prime'],['hold','Hold'],['non','Non prime'],['var','Variable'],['scr','Scrap']];
let S={bill:''};
ROWS.forEach(r=>{S[r[0]+'0']='';S[r[0]+'1']='';});
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)S={...S,...j};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const v=k=>{const x=parseFloat(S[k]);return isFinite(x)?x:0;};
const fmt=x=>isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';

$('g').innerHTML=ROWS.map(([k,l])=>
  '<div class="rl full">'+l+'</div>'+
  [0,1].map(i=>'<div class="fld"><input id="f_'+k+i+'" data-k="'+k+i+'" type="number" inputmode="decimal" step="any" aria-label="'+l+', entry '+(i?'B':'A')+'" value="'+S[k+i]+'"><span class="u">MT</span></div>').join('')
).join('');
$('f_bill').value=S.bill;

function render(){
  const bill=parseFloat(S.bill);
  const t=k=>v(k+'0')+v(k+'1');
  const ok=isFinite(bill)&&bill>0;
  let np=NaN,va=NaN,sc=NaN,sl=NaN,y=NaN,ng=NaN,mNp=NaN,mVa=NaN,mSc=NaN,mSl=NaN,mY=NaN,mNg=NaN;
  if(ok){
    np=t('non')/bill*100;va=t('var')/bill*100;sc=t('scr')/bill*100;
    sl=100-(t('act')/bill*100+np+va+sc);
    const good=t('prime')+t('hold');
    y=good/bill*100;
    ng=good>0?t('act')/good*100-100:NaN;mNp=t('non');mVa=t('var');mSc=t('scr');mY=good;mSl=bill-t('act')-mNp-mVa-mSc;mNg=good>0?t('act')-good:NaN;
  }
  $('note').textContent=ok?'':'Enter the billet rolled weight to see results.';
  $('hy').textContent=fmt(y);$('hn').textContent=fmt(ng);$('hs').textContent=fmt(sl);
  const line=(l,m,p,c)=>'<div class="row'+(c||'')+'"><dt>'+l+'</dt><dd>'+(m===null?'':fmt(m))+'</dd><dd>'+(p===null?'':fmt(p))+'</dd></div>';
  $('res').innerHTML='<div class="row hd"><dt></dt><dd>MT</dd><dd>%</dd></div>'+line('Non prime',mNp,np)+line('Variable',mVa,va)+line('Scrap',mSc,sc)+line('Scale',mSl,sl)+line('Total loss',mNp+mVa+mSc+mSl,np+va+sc+sl,' gap');
  
  
  
}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;S[k]=e.target.value;save();render();});
$('reset').addEventListener('click',()=>{for(const k in S){S[k]='';const f=$('f_'+k);if(f)f.value='';}save();render();});
render();
</script>
</body>
</html>
